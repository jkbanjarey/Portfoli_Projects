name: Validate cold-chain demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint and test
        run: |
          ruff check .
          pytest
      - name: Build Streamlit image
        run: docker build --tag cold-chain-agent:${{ github.sha }} .
